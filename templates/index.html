{% extends 'base.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="static\img\Aya.jpg" alt="Photo of {{ name }}">
                </div>
                <div class="hero-identity">
                    <p class="hero-kicker">Information Systems &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/zahranayla901" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/zahranaylaazfa/" class="social-link">LinkedIn</a>
                        <a href="mailto:zahra.nayla51@ui.ac.id" class="social-link">Email</a>
                        <a href="https://www.instagram.com/zaranayazfa/" class="social-link">Let's become mutual on IG!</a>
                    </div>
                </div>
            </div>
        </section>

        <!--Tambah section skills berupa logo dalam bentuk carousel-->
        <section class="content" id="skills">
            <div class="skill-panel">
                <div class="container">
                    <div class="skill-header">
                        <span class="skill-badge">Tools &amp; Expertise</span>
                        <h2 class="skill-title">Skills</h2>
                    </div>

                    <!--Carousel Container-->
                    <div class="skill-carousel" id="skills-carousel">
                        <div class="skill-track" id="skills-track">

                            <!--First Group-->
                            <div class="skill-group" id="skill-group-1">
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/Figma.png" alt="logo Figma" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/python.png" alt="logo Python" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/C.png" alt="logo C" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/Office.png" alt="logo Microsoft Office" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/Java.png" alt="logo Java" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/Canva.png" alt="logo Canva" width="32" height="32">
                                </div>
                            </div>

                            <!--Second Group (Duplicate for continuous scroll)-->
                            <div class="skill-group" id="skill-group-2" aria-hidden="true">
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/Figma.png" alt="" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/python.png" alt="" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/C.png" alt="" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/Office.png" alt="" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/Java.png" alt="" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/Canva.png" alt="" width="32" height="32">
                                </div>
                            </div>

                            <!--Third Group (Duplicate for continuous scroll)-->
                            <div class="skill-group" id="skill-group-3" aria-hidden="true">
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/Figma.png" alt="" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/python.png" alt="" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/C.png" alt="" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/Office.png" alt="" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/Java.png" alt="" width="32" height="32">
                                </div>
                                <div class="skill-item">
                                    <img class="skill-logo" src="static/img/Canva.png" alt="" width="32" height="32">
                                </div>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>
</html>
{% endblock content %}
