<form method="post" action="{% url 'main:toggle_star_experience' experience.id %}" class="star-form-exp">
    {% csrf_token %}
    <button type="submit"
            class="button button-star-exp{% if user in experience.starred_by.all %} is-starred-exp{% endif %}"
            title="{% if experience.starred_by.all %}Dibintangi oleh {{ experience.starred_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in experience.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count-exp">{{ experience.starred_by.count }}</span>
    </button>
</form>
